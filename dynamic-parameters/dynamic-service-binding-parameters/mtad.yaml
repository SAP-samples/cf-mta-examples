_schema-version: "3.3.0"
ID: dynamic-service-binding-parameters
version: 0.0.1

modules:
  - name: app
    type: application
    path: "appBits.zip"
    parameters:
      memory: 64M
      disk-quota: 256M
      health-check-type: process
      no-route: true
    requires:
      # The app binds to target-service; its binding config pulls
      # fields from source-service's named service key credentials.
      - name: target-service
        parameters:
          config:
            consumer-client-id: "{ds/source-service/service-keys.source-key.credentials.clientid}"
            consumer-xsappname: "{ds/source-service/service-keys.source-key.credentials.xsappname}"

resources:
  # PRODUCER: a managed service exposing a named service key whose
  # credentials are referenced in the binding config above.
  - name: source-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: ds-source-service
      config:
        xsappname: ds-source-service
        tenant-mode: dedicated
      service-keys:
        - name: source-key
          config: {}

  # CONSUMER: the service the app binds to; receives the resolved
  # values in its binding config.
  - name: target-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: ds-target-service
      config:
        xsappname: ds-target-service
        tenant-mode: dedicated
